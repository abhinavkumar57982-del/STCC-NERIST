<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password · STCC</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="css/particles.css" />
    <link rel="stylesheet" href="css/forgot-password.css" />
</head>
<body>

    <div id="toast" class="toast"></div>

    <!-- Particle Canvas -->
    <canvas id="particleCanvas" class="particle-canvas"></canvas>

    <div class="reset-wrapper">
        <div class="reset-card" id="resetCard">
            
            <!-- ===== STEP 1: Verify Account ===== -->
            <div id="stepVerify" class="reset-step active">
                <div class="reset-icon">
                    <i class="fas fa-key"></i>
                </div>
                <h2>Forgot Password</h2>
                <p class="subtitle">Enter your registered email and phone number to verify your account.</p>

                <form id="verifyForm">
                    <div class="form-group">
                        <label>Registered Email</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="resetEmail" placeholder="you@example.com" required />
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Registered Phone Number</label>
                        <div class="input-wrapper">
                            <i class="fas fa-phone"></i>
                            <input type="tel" id="resetPhone" placeholder="9876543210" required />
                        </div>
                    </div>

                    <button type="submit" class="btn-submit" id="verifyBtn">
                        <i class="fas fa-shield-alt"></i> Verify Account
                    </button>
                </form>

                <div class="reset-links">
                    <a href="login.html"><i class="fas fa-arrow-left"></i> Back to Login</a>
                </div>
            </div>

            <!-- ===== STEP 2: Reset Password ===== -->
            <div id="stepReset" class="reset-step">
                <div class="reset-icon">
                    <i class="fas fa-lock"></i>
                </div>
                <h2>Reset Password</h2>
                <p class="subtitle" id="resetUserInfo">Create a new password for your account.</p>

                <form id="resetForm">
                    <div class="form-group">
                        <label>New Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="newPassword" placeholder="Min 6 characters" required minlength="6" />
                            <button type="button" class="toggle-password" onclick="togglePassword('newPassword')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Confirm New Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-check-circle"></i>
                            <input type="password" id="confirmPassword" placeholder="Re-enter new password" required />
                            <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit" id="resetBtn">
                        <i class="fas fa-save"></i> Reset Password
                    </button>
                </form>

                <div class="reset-links">
                    <a href="login.html"><i class="fas fa-arrow-left"></i> Back to Login</a>
                </div>
            </div>

            <!-- ===== STEP 3: Success ===== -->
            <div id="stepSuccess" class="reset-step">
                <div class="reset-icon success">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h2>Password Reset Complete!</h2>
                <p class="subtitle">Your password has been successfully reset.</p>
                <p class="subtitle" style="color: var(--text-muted); font-size: 0.9rem; margin-top: 8px;">
                    You can now login with your new password.
                </p>
                <a href="login.html" class="btn-submit" style="display: inline-block; text-decoration: none; margin-top: 20px;">
                    <i class="fas fa-sign-in-alt"></i> Login Now
                </a>
            </div>

        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="js/config.js"></script> 
    <script src="js/particles.js"></script>
    <script>
        'use strict';

        // ✅ PRODUCTION API URL - USE YOUR ACTUAL RENDER URL
        const API_URL = window.API_URL || 'https://stcc-nerist.onrender.com/api';
        
        let resetToken = null;
        let verifiedEmail = null;
        let verifiedPhone = null;

        // ===== DOM Elements =====
        const stepVerify = document.getElementById('stepVerify');
        const stepReset = document.getElementById('stepReset');
        const stepSuccess = document.getElementById('stepSuccess');
        const verifyForm = document.getElementById('verifyForm');
        const resetForm = document.getElementById('resetForm');
        const resetUserInfo = document.getElementById('resetUserInfo');
        const toast = document.getElementById('toast');

        // ===== Toast =====
        function showToast(msg, isError = false) {
            toast.textContent = msg;
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 5000);
        }

        // ===== Toggle Password Visibility =====
        window.togglePassword = function(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.parentElement.querySelector('.toggle-password i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        };

        // ===== Switch Steps =====
        function showStep(step) {
            document.querySelectorAll('.reset-step').forEach(el => el.classList.remove('active'));
            if (step === 'verify') stepVerify.classList.add('active');
            else if (step === 'reset') stepReset.classList.add('active');
            else if (step === 'success') stepSuccess.classList.add('active');
        }

        // ===== Step 1: Verify Account (Email + Phone Match) =====
        verifyForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('resetEmail').value.trim();
            const phone = document.getElementById('resetPhone').value.trim();

            if (!email || !phone) {
                showToast('Please fill in all fields.', true);
                return;
            }

            // Validate email format
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showToast('Please enter a valid email address.', true);
                return;
            }

            // Validate phone format (10 digits)
            const phoneRegex = /^\d{10}$/;
            if (!phoneRegex.test(phone)) {
                showToast('Please enter a valid 10-digit phone number.', true);
                return;
            }

            const verifyBtn = document.getElementById('verifyBtn');
            verifyBtn.disabled = true;
            verifyBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';

            try {
                console.log('📡 Verifying account:', { email, phone });
                
                const response = await fetch(`${API_URL}/password-reset/verify`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ email, phone })
                });

                const data = await response.json();
                console.log('📥 Verify response:', data);

                if (!data.success) {
                    showToast(data.message || 'Account not found with these details.', true);
                    verifyBtn.disabled = false;
                    verifyBtn.innerHTML = '<i class="fas fa-shield-alt"></i> Verify Account';
                    return;
                }

                // ✅ ACCOUNT VERIFIED - DIRECTLY SHOW RESET FORM
                verifiedEmail = email;
                verifiedPhone = phone;
                
                // Store reset token if provided
                if (data.resetToken) {
                    resetToken = data.resetToken;
                }

                // Show reset form directly
                resetUserInfo.textContent = `Reset password for ${email}`;
                showStep('reset');
                showToast('✅ Account verified! Please set your new password.');

            } catch (error) {
                console.error('❌ Verify error:', error);
                showToast('Connection error. Please check your internet and try again.', true);
                verifyBtn.disabled = false;
                verifyBtn.innerHTML = '<i class="fas fa-shield-alt"></i> Verify Account';
            }
        });

        // ===== Step 2: Reset Password =====
        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validation
            if (!newPassword || !confirmPassword) {
                showToast('Please fill in all fields.', true);
                return;
            }

            if (newPassword.length < 6) {
                showToast('Password must be at least 6 characters.', true);
                return;
            }

            if (newPassword !== confirmPassword) {
                showToast('Passwords do not match.', true);
                return;
            }

            // Password strength check
            if (!/[A-Z]/.test(newPassword)) {
                showToast('Password must contain at least one uppercase letter.', true);
                return;
            }

            if (!/[0-9]/.test(newPassword)) {
                showToast('Password must contain at least one number.', true);
                return;
            }

            const resetBtn = document.getElementById('resetBtn');
            resetBtn.disabled = true;
            resetBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting...';

            try {
                // ✅ If we have a reset token, use it
                if (resetToken) {
                    console.log('📡 Resetting password with token:', resetToken);
                    
                    const response = await fetch(`${API_URL}/password-reset/reset`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({
                            token: resetToken,
                            newPassword: newPassword,
                            confirmPassword: confirmPassword
                        })
                    });

                    const data = await response.json();

                    if (!data.success) {
                        throw new Error(data.message || 'Password reset failed.');
                    }
                } 
                // ✅ Direct reset with email + phone (no token needed)
                else if (verifiedEmail && verifiedPhone) {
                    console.log('📡 Direct reset with email+phone:', { email: verifiedEmail, phone: verifiedPhone });
                    
                    const response = await fetch(`${API_URL}/password-reset/direct-reset`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({
                            email: verifiedEmail,
                            phone: verifiedPhone,
                            newPassword: newPassword
                        })
                    });

                    const data = await response.json();

                    if (!data.success) {
                        throw new Error(data.message || 'Password reset failed.');
                    }
                } 
                else {
                    throw new Error('Reset session expired. Please go back and verify again.');
                }

                // ✅ SUCCESS!
                showStep('success');
                resetToken = null;
                verifiedEmail = null;
                verifiedPhone = null;

            } catch (error) {
                console.error('❌ Reset error:', error);
                showToast(error.message || 'Password reset failed. Please try again.', true);
                resetBtn.disabled = false;
                resetBtn.innerHTML = '<i class="fas fa-save"></i> Reset Password';
            }
        });

        // ===== Init =====
        console.log('🔐 Forgot Password page loaded');
        console.log(`📡 API URL: ${API_URL}`);
    </script>

</body>
</html>
